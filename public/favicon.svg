<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="8" opacity="0.6" />

  <!-- Checkmark circle -->
  <circle cx="256" cy="256" r="170" fill="#10B981" opacity="0.12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#check-grad)" stroke-width="24" stroke-dasharray="16 12" />

  <!-- Glowing checkmark path -->
  <path
    d="M170 265 L230 325 L345 190"
    fill="none"
    stroke="url(#check-grad)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Top-right energy frog dot -->
  <circle cx="370" cy="140" r="28" fill="#10B981" />
  <text x="370" y="148" font-size="28" text-anchor="middle" dominant-baseline="middle">🐸</text>
</svg>
